[package]
name = "mcp_info_server"
version = "0.1.0"
edition = "2024"
authors = ["Cooper Ry Lees <me@cooperlees.com>"]
license = "GPL-2.0-or-later"
repository = "https://github.com/cooperlees/mcp_info_server"
description = "Public, unauthenticated MCP server exposing cooperlees.com's blog posts, pages, and resume"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
hickory-resolver = "0.26.1"
htmd = "0.5"
moka = { version = "0.12.15", features = ["future"] }
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "experimental_trace_batch_span_processor_with_async_runtime"] }
prometheus = { version = "0.14.0", default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
rmcp = { version = "3.0", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
schemars = "1"
scraper = "0.27"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2"
tokio = { version = "1.53.1", features = ["full"] }
tonic = { version = "0.14", default-features = false, features = ["transport"] }
tracing = "0.1.44"
tracing-glog = "0.4"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2"

[dev-dependencies]
mockito = "1.7.2"
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
strip = "symbols"
lto = "thin"
