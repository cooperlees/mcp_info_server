name: Rust CI

on: [push, pull_request]

jobs:
  build_and_test:
    name: Rust Cargo CI on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true
          # On pull_request events checkout defaults to a detached merge
          # commit, from which `git push` below fails with exit 128
          # ("You are not currently on a branch"). Checking out the head
          # ref instead puts the runner on the real branch so the fixup
          # commit can be pushed back. Falls back to the push-event branch
          # name when head_ref is empty (i.e. not a PR run).
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Auto-bump Cargo.toml version to today's CalVer (YY.M.D) if stale
        # See AGENTS.md: [package].version tracks the UTC date of the most
        # recent change, bumped on every commit (human or AI) - not a
        # per-release counter. Multiple same-day commits keep the same
        # version; exact same-day builds are already disambiguated by the
        # git commit + build timestamp shown on the root route (main.rs's
        # `banner()`), so there's no need for this to be unique per commit,
        # only accurate as of today.
        #
        # Rather than failing the build when the version is stale, this step
        # auto-bumps Cargo.toml (and the matching Cargo.lock entry) and
        # pushes a fixup commit so the branch always stays green.
        run: |
          expected="$(date -u +%y.%-m.%-d)"
          actual="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$actual" = "$expected" ]; then
            echo "Version is already up-to-date ($actual)."
            exit 0
          fi
          echo "Bumping Cargo.toml version: $actual -> $expected"
          sed -i "s/^version = \"$actual\"/version = \"$expected\"/" Cargo.toml
          # Refresh the Cargo.lock root entry to match. Neither
          # `cargo metadata` nor `cargo update -p ... --offline` can do
          # this here: the former never writes the lockfile, and the latter
          # needs a warm registry index, which a fresh runner doesn't have
          # yet at this point in the job (verified: `no matching package
          # named anyhow ... location searched: crates.io index`). The root
          # stanza appears exactly once, so rewrite just its version line -
          # deterministic, offline, zero dependency drift - then assert it.
          sed -i '/^name = "mcp_info_server"$/,/^version = / s/^version = ".*"/version = "'"$expected"'"/' Cargo.lock
          # NOTE: keep this as if/else, not `grep -q ... || { ...; }` -
          # the || form spuriously takes the failure branch on the
          # ubuntu-latest runner even when the grep matches (proven over
          # three E2E runs on PR #29: staged exit codes showed the
          # identical grep exiting 0, yet || still fired). The if form
          # behaves correctly on the same runner.
          if grep -A1 '^name = "mcp_info_server"$' Cargo.lock | grep -q "version = \"$expected\""; then
            echo "Cargo.lock root entry updated to $expected."
          else
            echo "Cargo.lock root entry did not update to $expected" >&2
            exit 1
          fi
          # Fork PRs check out fine but can't be pushed back with
          # GITHUB_TOKEN (scoped to the base repo) - skip the fixup there
          # rather than failing the whole job; the author can bump locally.
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "" ] && \
             [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "Fork PR: leaving the version bump uncommitted."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: auto-bump Cargo.toml version to $expected (CalVer)"
          git push

      - name: Cargo format
        run: cargo fmt --check

      - name: Cargo test
        run: cargo test --all-features

      - name: Cargo release build
        run: cargo build --release --all-features

      - name: Show development + release build sizes
        run: |
          ls -lh target/debug/ || true
          ls -lh target/release/

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Start the release build for a live MCP client check
        run: |
          RUST_LOG=info LISTEN_PORT=6969 ./target/release/mcp_info_server &
          echo $! > server.pid
          for _ in $(seq 1 20); do
            curl -sf http://127.0.0.1:6969/healthz && exit 0
            sleep 0.5
          done
          echo "server never became healthy" >&2
          exit 1

      - name: Hit it with a real MCP client (Inspector CLI, stateful/session-based)
        # protocol_smoke.rs (run above by `cargo test`) already checks the
        # wire contract with our own reqwest client - this instead proves an
        # independent, official client implementation can actually drive
        # this server, the same way a real user's LLM TUI would. The
        # Inspector CLI does the classic initialize -> Mcp-Session-Id ->
        # tools/list handshake (confirmed against this server's own debug
        # logs), so this exercises the legacy_session_mode path specifically
        # - see the next step for the 2026-07-28 stateless path.
        run: |
          npx --yes @modelcontextprotocol/inspector --cli http://127.0.0.1:6969/mcp \
            --method tools/list > tools_list.json
          cat tools_list.json
          for tool in list_posts get_post list_pages get_page get_resume list_countdowns get_countdown; do
            grep -q "\"$tool\"" tools_list.json || { echo "Inspector CLI's tools/list is missing '$tool'"; exit 1; }
          done

      - name: Hit it statelessly too (2026-07-28, no initialize/session)
        # The MCP Inspector CLI above only speaks the legacy session-based
        # handshake, so it can't exercise the 2026-07-28 stateless path
        # (SEP-2567) this server also supports - check that directly against
        # the same live release binary: a bare, self-describing tools/list
        # request with no prior initialize call, same shape as the
        # protocol_smoke regression test and the README example.
        run: |
          curl -sf -D headers.txt http://127.0.0.1:6969/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -H 'MCP-Protocol-Version: 2026-07-28' \
            -H 'Mcp-Method: tools/list' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}' \
            -o stateless_tools_list.json
          cat headers.txt
          cat stateless_tools_list.json
          grep -qi '^content-type: application/json' headers.txt || {
            echo "expected a plain JSON reply (json_response=true), not SSE"; exit 1;
          }
          if grep -qi '^mcp-session-id:' headers.txt; then
            echo "a stateless 2026-07-28 request must not get an Mcp-Session-Id - sessions were removed by SEP-2567"
            exit 1
          fi
          for tool in list_posts get_post list_pages get_page get_resume list_countdowns get_countdown; do
            grep -q "\"$tool\"" stateless_tools_list.json || { echo "stateless tools/list is missing '$tool'"; exit 1; }
          done

      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true
